name: Scanner Normalizer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python -m src.scanner_normalizer.cli \
            --scanner tenable \
            --input data/tenable_findings.json \
            --output /tmp/normalized.jsonl
          test "$(wc -l < /tmp/normalized.jsonl)" -eq 2
